# governance.boundary.yml
# Premium boundary template — Governance: 機密文書 / 内部判断 / 個人情報 leak prevention
#
# Bundle: Aira Boundary Templates Premium Pack
# License: Single-org commercial use OK, redistribution NOT permitted
# Version: 1.0.0
# Last updated: 2026-05-02
#
# 想定 use case:
# - 1 owner + multi AI peer org で、内部 board / inbox / status に
#   confidential / internal-only / personal info が含まれる場合の digest 生成前 redact
# - external surface (Slack post / email / public dashboard) に digest を流す前 boundary audit
#
# Integration: yuino.config.yml の boundary.custom_rules に extend で merge
#
# usage:
#   boundary:
#     monitor_types:
#       - scope_creep      # default builtin
#       - sensitive_info_leak  # default builtin
#     custom_rules:
#       !include templates/boundary/governance.boundary.yml#custom_rules

version: 1
name: governance
description: 機密文書 / 内部判断 / 個人情報 leak prevention rules

custom_rules:
  # === 機密文書 / 内部限り ===
  - id: confidential_doc
    pattern: '(confidential|機密|社外秘|外部秘)'
    action: deny
    message: 'Confidential document content detected — output blocked'

  - id: internal_only
    pattern: '(internal[_ -]?only|社内限り|内部限定)'
    action: deny
    message: 'Internal-only content detected — output blocked'

  - id: do_not_share
    pattern: '(do[_ -]?not[_ -]?share|do[_ -]?not[_ -]?distribute|転送禁止|配布禁止)'
    action: deny
    message: 'Non-distributable content detected — output blocked'

  # === 個人情報 (PII) ===
  - id: pii_email
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    action: warn
    message: 'Email address detected — verify if this should appear in digest output'

  - id: pii_phone_jp
    pattern: '\b(0\d{1,4}-\d{1,4}-\d{4}|\+81-?\d{1,4}-?\d{1,4}-?\d{4})\b'
    action: warn
    message: 'JP phone number detected — verify before output'

  - id: pii_phone_intl
    pattern: '\b\+\d{1,3}\s?\d{1,14}\b'
    action: warn
    message: 'International phone number detected — verify before output'

  - id: pii_credit_card
    pattern: '\b(?:\d{4}[\s-]?){3}\d{4}\b'
    action: deny
    message: 'Credit card number pattern detected — output blocked'

  - id: pii_my_number_jp
    pattern: '\b\d{4}\s?\d{4}\s?\d{4}\b'
    action: warn
    message: 'JP マイナンバー pattern detected — verify before output (false positive possible: any 12-digit run)'

  # === 内部判断 / draft 状態 ===
  - id: draft_decision
    pattern: '(draft[_ -]?decision|未確定判断|議論中|TBD|to be (decided|determined))'
    action: warn
    message: 'Draft / undecided content detected — confirm finalization before public output'

  - id: legal_review_pending
    pattern: '(legal[_ -]?review[_ -]?pending|legal[_ -]?hold|法務確認中|法務 review 待ち)'
    action: deny
    message: 'Legal review pending content detected — output blocked until cleared'

  # === 個人名 + 評価 (HR sensitive) ===
  - id: hr_evaluation_marker
    pattern: '(performance[_ -]?review|low[_ -]?performer|underperform|改善指導|降格検討)'
    action: deny
    message: 'HR-sensitive evaluation content detected — output blocked'

# === optional metadata for template publish ===
metadata:
  bundle: aira-boundary-templates-premium
  templates_in_bundle: 3
  bundle_price_jpy: 1200
  individual_price_jpy: 500
  bundle_price_usd: 8.00
  individual_price_usd: 3.50
  available_at:
    - https://nexus-lab.booth.pm
    - https://nexuslabzen.gumroad.com
