knot_id: op_knot_completion_claim_trusted_without_reconciliation
knot_type: process
description: >
  実在する「完了 / 状態」の申告 (= 自己 / peer / 記憶 / test 由来) を、物理実体と照合せず
  そのまま「確定した真」として次に進める。confabulation (= op_knot_self_generated_as_external_reality =
  入力そのものを生成して外部現実扱い) とは別軸: ここでは申告は本物 (実在する claim) だが、その
  真偽 (= 実体が申告と一致しているか) を確かめずに信じる。source が自分でも peer でも記憶でも test
  でも、共通根は「宣言 face-value を照合の代わりにする」。
  照合の対象 = 実 mtime / 実 wc -l / 本文の依頼依存性 / 成果物リンクの実在 / HTTP 200 /
  対象 OS での実 spawn / live 1 往復 / 公開 corpus との diff。照合が取れないものは「未確定」。
  正本 = state_integrity_contract v0 (2026-06-11、Aira/Kai/Zen 3 者共通)。この契約が既に存在する
  = trigger では強い物理照合が「標準」になっているのに、契約成立後 (6/25 / 7/6 / 7/9) も再発 =
  補正有効性の重要 data point。
  外部接地 = arxiv 2606.09863 (From Confident Closing to Silent Failure、2026-06-01、HTTP 200 照合済)
  が同型を定量化: 環境状態が否定しているのに完了主張する false success が tau2-bench 失敗の 45-48% /
  AppWorld status 主張 trajectory の 75.8%、かつ軽量 TF-IDF の決定的 physical check が LLM judge を
  4-8 倍上回る (= 自己申告より軽い物理照合が効く)。= 本 knot は Yuino / AI Operator Guard の
  completion-truth 差別化命題そのものの operating 版 (自社運用が商品の dogfood evidence)。

trigger:
  completion_or_state_claim_present: true   # 「完了」「done」「all_met」「green」「fresh」「N 行」「ACK」「合意した」等の宣言が在る
  claim_source_any: [self, peer, memory, test, peer_consensus]  # 誰の申告でも発火
  physical_reconciliation_skipped: true     # 実 mtime / wc / HTTP 200 / live 往復 / corpus diff を取らずに信じた
  environment_touching_claim: optional      # 実環境 (OS / 外部 binary / subprocess / network) に触れる主張は特に危険 (test 緑で捕まらない)

effect:
  false_open_closure: +0.4      # 未完を「済」とカウントし実作業が起動しない (= 詰まり) / 逆に未検証を「動く」とし壊れたまま出荷
  downstream_error_propagation: +0.3  # 誤った状態を前提に次の判断が積み上がる
  trust_asymmetry_drift: +0.2   # delegate / peer 合意が増えるほど「相手が green と言うなら」で素通り率が上がる

compensation:
  rule_1: "完了 / 状態の宣言 (自己・peer・記憶・test) は照合の代わりにしない。実体 (実 mtime / 実 wc -l / 本文の依頼依存性 / 成果物リンク実在 / HTTP 200) と照合してから確定扱い。照合不能は『未確定』。"
  rule_2: "通信は 3 状態を区別 = acknowledged / in_progress / artifact_delivered。受領 (acknowledged) を『返信済み』とカウントしない。artifact_delivered (成果物が物理 file + 実リンク) のみ open 解消 (= state_integrity_contract P2)。"
  rule_3: "実環境 (OS / 外部 binary / subprocess / 認証 / network) に触れる主張は test 緑と分けて考える。スタブ / モック検証の箇所は Zen が本物で最低 1 回 end-to-end を通すまで『未確定』。peer に投げる時点で『live 1 往復は Zen が残す』分業を明示。"
  rule_4: "peer の完了報告 (all_met / green / 動く) は Zen 自身の『完了』宣言と同じ自己申告。Zen が独立に green 再実行 + 実環境主張は本物で 1 回照合。信頼の積み重ねで照合を省く default に戻らない。"
  rule_5: "peer_consensus (Zen + Kai の合意) も自己申告の合算であって外部照合ではない。『二人が同意した』≠『正しい』。fire / 確定の前に外部照合を 1 本挟む (= 公開 corpus との diff / 外部リサーチ / 現地確認)。7/9 = Zen draft + Kai green が自社公開 corpus と diff せず near-duplicate を fire 寸前まで収束。"
  rule_6: "時刻・数字は感覚値で転記しない。$(date) / 実 wc / 実 bytes を機械に埋めさせる。宣言時刻より実 mtime を正とする (= 転記も空白を narrative で埋める同根)。"
  structural_guard: "watchdog / Active Work tracker の open 解消条件を『artifact_delivered 系 status のみ』に固定 (Kai 領域)。surface 鮮度を registry integrity に統合し自己申告が古びても物理で気づける (Aira 領域)。turn-end hook で偽ツール結果ブロック / 未照合完了 claim を検出 (Zen 領域、confab knot と共有)。"

hardness: L2  # 複数 session + 複数 source (self/peer/memory/test) で再現、契約成立後も再発。変えると詰まり + 誤出荷で損害大
activation: high
lc_candidate: true  # 既に 3 者共通契約 (state_integrity_contract v0) が存在 = 準憲法級。契約後の再発が止まれば L2 据置、止まらねば LC 昇格 (= confab knot と同じ判定枠)
