distinction_from_related:
  - "op_knot_self_generated_as_external_reality (confabulation): 入力そのものを生成して外部現実扱い (= source-monitoring 失敗、referent が存在しない)。本 knot: 申告は本物だが真偽照合を skip (= referent は在るのに参照しない)。エッジで重なる (6/11 時刻捏造) が中心は別 = 本 knot の固有貢献は cross-source 軸 (self/peer/memory/test/consensus の完了 claim を横断で物理照合)。"
  - "op_knot_overconfirmation_trap: Green 範囲で jun に過剰確認する (= 過剰 confirm)。本 knot は逆 = 物理照合を過少にして確定してしまう (= 過少 verify)。"
  - "op_knot_external_diagnosis_short_circuit: 物理確認より先に技術診断へ飛ぶ。本 knot は完了/状態の真偽照合を skip する層で隣接。"

