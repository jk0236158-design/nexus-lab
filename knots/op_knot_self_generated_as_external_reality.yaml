model_observed: "claude-opus-4-8 (5/5)。6/12-18 の 3 件は session 途中 Fable 5 → Opus 4.8 切替後と物理確認済。6/22 の 2 件の cross-model 切替有無は未照合 (= 別 wake で transcript の model field 確認候補、aggravator が必須トリガか亜型分離の検定になる)"
