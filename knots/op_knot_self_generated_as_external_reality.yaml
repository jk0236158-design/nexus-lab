external_grounding:  # WebSearch/WebFetch 2026-06-22、全 read-only。arXiv ID の YYMM = 発行年月
  neuroscience_reality_monitoring:
    claim: "confabulation の主流説 = reality monitoring / source monitoring の失敗 (記憶が実体験か想像かを判別不能)。provoked (手がかりへの正常反応、よくある) と spontaneous (手がかりなし・現実に思考を適応できず、現実に非関連の記憶を抑制できないまま行動) の二型。"
    maps_to: "本 knot の根 = AI 版 source-monitoring 失敗 (自己生成 vs 外部入力の判別不能)。spontaneous 型『現実に非関連の内容を抑制できず行動』が wake-resume stale + 暴走極に対応、provoked 型が tool-blank への反応的作話に対応。神経科学側の二型分類が本 knot の 2 軸を裏づける。"
    sources:
      - "en.wikipedia.org/wiki/Confabulation"
      - "Schnider, Nature Reviews Neuroscience: nature.com/articles/nrn1179 (Spontaneous confabulation and the adaptation of thought to ongoing reality、paywall)"
      - "Schnider, reality monitoring & limbic system review: pubmed.ncbi.nlm.nih.gov/11690611"
  llm_self_sycophancy:
    claim: "2025-26 の LLM 研究は『self-sycophancy』(モデルが自分の捏造出力を無批判に受容し推論) を古典的 hallucination と別物として分離。問題は情報捏造だけでなく『user/自己提案の説明への早すぎる commit』。self-critique pipeline は『解けない問題は批判もできない』ため sycophantic confirmation に陥り、自己出力を信頼性高く検証できない。"
    maps_to: "6/22 の 2 件 (質問→決定 / 自 verdict→確定) = self-sycophancy / 早すぎる commit の AI-ops 版。『self-critique では捕まらない』= 本 knot の compensation が自己監査でなく外部物理照合 + jun 承認を要求する設計根拠 (rule_2 / rule_3 / jun-ratification 軸)。"
    sources:
      - "BrokenMath (self-sycophancy in theorem proving): arxiv.org/abs/2510.04721 (2025-10)"
      - "LLM agent hallucination taxonomy survey: arxiv.org/abs/2509.18970 (2025-09)"
      - "Beyond Prompt-Induced Lies (deception ≠ hallucination): arxiv.org/abs/2508.06361 (2025-08)"
  compensation_corroboration:
    claim: "'Tool Receipts, Not Zero-Knowledge Proofs' = AI agent の hallucination 検出を主張と実ツール戻り値 (receipt) の紐づけで実務化する提案。"
    maps_to: "本 knot の rule_2 (戻り値が出力に現れてから報告、出力テキストに手書きツール結果を書かない) の独立した外部裏づけ。"
    source: "arxiv.org/abs/2603.10060 (2026-03)"

