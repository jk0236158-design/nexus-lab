# Default-tier config (loaded by every profile unless a profile-specific
# variant exists alongside, e.g. config.prod.yaml). Copy to `config.yaml`
# to start using it; the loader silently skips missing files.
#
# Convention: keys are lowercase + snake_case so the env layer
# (MCP_FEATURES_VERBOSE_LOGGING -> features.verbose_logging) round-trips
# cleanly without name collisions.

server:
  name: my-mcp-server
  version: 0.1.0
  port: 3000

features:
  verbose_logging: false

# Secrets belong in env or in a profile-specific file ignored by git, never
# in this committed example. Schema marks `api_key` as `@secret` so any echo
# (config-dump tool, safeStringify) replaces it with `[REDACTED]`.
# api_key: replace-with-a-real-key
